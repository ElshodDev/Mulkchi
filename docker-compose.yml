version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mulkchi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mulkchi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mulkchi_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mulkchi_api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mulkchi;Username=postgres;Password=password
      - Redis__ConnectionString=redis:6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

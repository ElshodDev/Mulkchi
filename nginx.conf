# Mulkchi - Nginx Configuration for SignalR WebSocket Support
# BMI: Production-ready WebSocket proxy configuration

upstream mulkchi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP to HTTPS redirect (optional for development)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    # SignalR WebSocket endpoint - requires special handling
    location /hubs/ {
        # WebSocket support
        proxy_pass http://mulkchi_backend;
        proxy_http_version 1.1;
        
        # BMI: WebSocket upgrade headers - critical for SignalR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for long-lived connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Buffer settings
        proxy_buffering off;
        proxy_cache off;
        
        # Maximum body size for negotiate requests
        client_max_body_size 10M;
    }
    
    # API endpoints
    location /api/ {
        proxy_pass http://mulkchi_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection keepalive for better performance
        proxy_set_header Connection "";
        
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        
        client_max_body_size 50M;
    }
    
    # Static files (uploaded images)
    location /uploads/ {
        proxy_pass http://mulkchi_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cache static files
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://mulkchi_backend;
        access_log off;
    }
}

# WebSocket specific optimization map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
